<svg xmlns="http://www.w3.org/2000/svg" width="900" height="350" viewBox="0 0 900 350" role="img" aria-label="Career timeline: BS 2021 to 2025, Matric teaching from April 2024, MS Data Science from 2025, ADP lecturing from November 2025">
